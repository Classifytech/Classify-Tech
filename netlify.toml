[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/shorten"
  to = "/.netlify/functions/shorten"
  status = 200
  force = true

[[redirects]]
  from = "/s/:code"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/post/:id"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
